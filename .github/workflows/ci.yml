name: ci

# Ejecuta todas las pruebas del proyecto en cada push y en cada pull request.
# No necesita nada instalado en tu equipo: se ejecuta en GitHub.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas (agente, panel, empaquetado y navegador)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 python3-pip xz-utils file
          # lupa (agente Lua con el stream.lua real) y esprima (sintaxis de la WebUI)
          python3 -m pip install --quiet --user lupa esprima \
            || python3 -m pip install --quiet --break-system-packages lupa esprima

      - name: Arrancar el agente simulado y el panel
        run: |
          mkdir -p var
          printf 'token-ci' > var/agent.token
          nohup python3 tools/mock_agent.py --data-dir var --log-file var/astra.log \
            > var/mock.log 2>&1 &
          ASTRA_WEBUI_ADMIN_PASSWORD='Ci-12345678' PYTHONPATH=panel \
            nohup python3 -m astra_webui --dev --port 8000 --data-dir var \
            > var/panel.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "el panel responde"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health

      - name: Pruebas
        env:
          ASTRA_WEBUI_TEST_PASSWORD: Ci-12345678
        run: python3 tools/run_tests.py

      - name: Registro del panel si algo falla
        if: failure()
        run: |
          echo "--- panel.log ---"; tail -n 60 var/panel.log 2>/dev/null || true
          echo "--- mock.log ---"; tail -n 60 var/mock.log 2>/dev/null || true

      - name: Sintaxis de todos los scripts
        run: |
          set -e
          for f in packaging/build-deb.sh packaging/wsl/setup-in-wsl.sh \
                   packaging/offline/instalar-offline.sh packaging/online/instalar.sh; do
            bash -n "$f" && echo "bash -n OK  $f"
          done
          for f in packaging/scripts/postinst packaging/scripts/prerm packaging/scripts/postrm; do
            sh -n "$f" && echo "sh -n OK    $f"
          done

      - name: Construir el paquete offline
        run: python3 tools/make_offline_bundle.py --no-fork

      - name: Construir el .deb (comprobación de empaquetado)
        run: |
          python3 tools/deb_stage.py --root build/panel --no-core
          python3 tools/build_deb.py --root build/panel \
            --out dist/astra-webui-panel_1.0.0-1_all.deb -v
          python3 tools/build_deb.py --verify dist/astra-webui-panel_1.0.0-1_all.deb
