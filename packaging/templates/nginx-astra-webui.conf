# Ejemplo de proxy inverso con TLS para Astra WebUI
#
#   sudo cp plantillas/nginx-astra-webui.conf /etc/nginx/sites-available/astra-webui
#   sudo ln -s /etc/nginx/sites-available/astra-webui /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sirve el panel por HTTPS y deja el streaming en su propio puerto (el TS no se proxya:
# el reproductor se conecta directamente a :8001, así nginx no consume ancho de banda).
#
# Si no tienes Internet, genera un certificado autofirmado:
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#     -keyout /etc/ssl/private/astra-webui.key \
#     -out /etc/ssl/certs/astra-webui.crt -subj "/CN=astra.local"

server {
    listen 80;
    server_name _;
    # redirige todo a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/astra-webui.crt;
    ssl_certificate_key /etc/ssl/private/astra-webui.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # el panel no sirve ficheros grandes: 8 MB es de sobra (copias de seguridad incluidas)
    client_max_body_size 8m;

    # SSE (logs y eventos en vivo) y WebSockets: sin buffer y con tiempos largos
    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /api/logs/astra/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Si quieres que las listas M3U y los enlaces generados usen el dominio público,
    # configura en el panel (Ajustes → Streaming) la "URL pública base", por ejemplo
    # https://tv.midominio.com:8001 (o publica también el 8001 por el mismo proxy).
}
